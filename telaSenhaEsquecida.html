<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CommonVault - Senha Esquecida</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>

    <a href="telaLogin.html" class="cadastro">Lembrei!</a>

    <h1>CommonVault</h1>

    <form id="formSenhaEsquecida">

        <label for="login">Digite seu e-mail abaixo:</label>
        <input type="email" id="login" placeholder="esquecido@email..." required> <br>

        <div class="captcha">
            <input type="checkbox" id="confirma" required> 
            <label for="confirma">Não sou um robô</label>
        </div>
        
        <button type="submit" class="botao">Enviar</button>
    </form>
</body>
</html>
